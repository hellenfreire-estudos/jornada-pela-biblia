<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Jornada pela Bíblia</title>

<style>

:root{
    --azul:#214d7d;
    --azul-claro:#2f72b7;
    --verde:#239957;
    --laranja:#f08a20;
    --roxo:#7533ad;
    --rosa:#ef3f63;
    --fundo:#eef7ff;
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:var(--fundo);
    color:#183a60;
}

button{
    font-family:inherit;
}

/* =========================
CABEÇALHO
========================= */

.topo{
    position:sticky;
    top:0;
    z-index:100;
    background:white;
    border-bottom:1px solid #d9e5ef;

    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 16px;
}

.logo{
    font-size:22px;
    font-weight:900;
    color:var(--azul);
}

.voltar{
    display:none;

    width:46px;
    height:46px;

    border:0;
    border-radius:50%;

    background:var(--azul);
    color:white;

    font-size:34px;
    line-height:1;

    cursor:pointer;
}

/* =========================
CONTEÚDO
========================= */

.pagina{
    max-width:950px;
    margin:auto;
    padding:18px;
}

.hidden{
    display:none !important;
}

/* =========================
IMAGEM PRINCIPAL
========================= */

.imagem-principal{
    width:100%;
    max-height:520px;

    object-fit:cover;
    display:block;
}

/* =========================
BOTÕES PRINCIPAIS
========================= */

.botoes-principais{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:12px;

    margin-top:18px;
}

.botao-principal{

    border:0;

    border-radius:25px;

    min-height:145px;

    color:white;

    font-size:clamp(16px,3vw,26px);

    font-weight:900;

    padding:14px 8px;

    cursor:pointer;

    box-shadow:
    0 7px 18px
    rgba(20,60,100,.20);

}

.botao-principal span{

    display:block;

    font-size:42px;

    margin-bottom:8px;

}

.historia{
    background:linear-gradient(
    135deg,
    #247cc2,
    #15539c);
}

.aprender{
    background:linear-gradient(
    135deg,
    #36b967,
    #168144);
}

.atividade{
    background:linear-gradient(
    135deg,
    #ffae32,
    #ef6e14);
}

.familia{
    background:linear-gradient(
    135deg,
    #9b55df,
    #5b1b9e);
}

/* =========================
COMEÇAR A JORNADA
========================= */

.comecar-jornada{

    width:100%;

    margin-top:16px;

    border:0;

    border-radius:28px;

    padding:22px 15px;

    background:
    linear-gradient(
    135deg,
    #ff5d78,
    #ed174d);

    color:white;

    font-size:
    clamp(24px,5vw,38px);

    font-weight:900;

    cursor:pointer;

    box-shadow:
    0 8px 20px
    rgba(190,30,70,.25);

}

/* =========================
TÍTULOS
========================= */

.titulo{

    text-align:center;

    font-size:
    clamp(30px,6vw,46px);

    color:var(--azul);

    margin:15px 0 8px;

}

.subtitulo{

    text-align:center;

    font-size:19px;

    color:#61758a;

    margin-bottom:25px;

}

/* =========================
MENU INTERNO
========================= */

.abas{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-bottom:16px;

}

.aba{

    white-space:nowrap;

    border:0;

    border-radius:18px;

    padding:12px 16px;

    background:#dceaf6;

    color:var(--azul);

    font-weight:800;

    cursor:pointer;

}

.aba.ativa{

    background:var(--azul);

    color:white;

}

/* =========================
HISTÓRIAS
========================= */

.lista-historias{

    display:grid;

    gap:14px;

}

.card-historia{

    background:white;

    border-radius:22px;

    padding:18px;

    border:2px solid #e0ebf4;

    box-shadow:
    0 5px 18px
    rgba(20,60,100,.10);

    cursor:pointer;

}

.card-historia h3{

    margin:9px 0;

    font-size:24px;

}

.card-historia p{

    margin:6px 0;

    color:#536d84;

}

.tag{

    display:inline-block;

    padding:5px 10px;

    border-radius:18px;

    background:#e7f3ff;

    color:var(--azul);

    font-size:14px;

    font-weight:800;

}

/* =========================
CAIXAS
========================= */

.caixa{

    background:white;

    border-radius:24px;

    padding:20px;

    box-shadow:
    0 5px 20px
    rgba(20,60,100,.12);

    font-size:18px;

    line-height:1.65;

}

.licao{

    margin-top:18px;

    padding:16px;

    border-radius:16px;

    background:#e9f8ef;

    border-left:
    6px solid #249e58;

}

.reflexao{

    margin-top:18px;

    padding:16px;

    border-radius:16px;

    background:#f2e9ff;

    border-left:
    6px solid #7835ae;

}

/* =========================
ATIVIDADES
========================= */

.cores{

    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin:15px 0;

}

.cor{

    width:44px;
    height:44px;

    border-radius:50%;

    border:4px solid white;

    box-shadow:
    0 2px 8px #999;

    cursor:pointer;

}

canvas{

    width:100%;

    height:auto;

    border-radius:18px;

    border:2px solid #d5e3ed;

    background:white;

    touch-action:none;

}

/* =========================
PUZZLE
========================= */

.puzzle{

    position:relative;

    width:100%;

    max-width:650px;

    margin:auto;

    aspect-ratio:3/2;

    background:#dceaf4;

    border-radius:18px;

    overflow:hidden;

}

.peca{

    position:absolute;

    width:33.333%;

    height:50%;

    background-image:
    url("2026-09-06_Original.png");

    background-size:300% 200%;

    border:2px solid white;

    touch-action:none;

    cursor:grab;

    box-shadow:
    0 3px 8px
    rgba(0,0,0,.20);

}

.peca:active{
    cursor:grabbing;
}

/* =========================
BÍBLIA
========================= */

.botao-biblia{

    display:inline-block;

    margin-top:15px;

    padding:16px 22px;

    background:var(--azul);

    color:white;

    border-radius:18px;

    text-decoration:none;

    font-weight:900;

}

/* =========================
CELULAR
========================= */

@media(max-width:600px){

    .pagina{
        padding:10px;
    }

    .botoes-principais{
        gap:8px;
    }

    .botao-principal{

        min-height:112px;

        border-radius:20px;

        font-size:15px;

    }

    .botao-principal span{
        font-size:32px;
    }

    .logo{
        font-size:19px;
    }

}

</style>
</head>

/* =====================================================
PINTURA
===================================================== */

function iniciarPintura(){

const canvas =
document.getElementById("telaPintura");

const ctx =
canvas.getContext("2d");


/* DESENHO BASE */

ctx.strokeStyle="#1c3148";

ctx.lineWidth=9;

ctx.lineJoin="round";


/* CASCO DA ARCA */

ctx.beginPath();

ctx.moveTo(150,360);

ctx.lineTo(650,360);

ctx.lineTo(590,435);

ctx.lineTo(210,435);

ctx.closePath();

ctx.stroke();


/* CASA */

ctx.beginPath();

ctx.rect(
250,
220,
300,
140
);

ctx.stroke();


/* TELHADO */

ctx.beginPath();

ctx.moveTo(200,220);

ctx.lineTo(400,80);

ctx.lineTo(600,220);

ctx.stroke();


/* PORTA */

ctx.beginPath();

ctx.rect(
365,
280,
70,
80
);

ctx.stroke();


ctx.font="bold 34px Arial";

ctx.fillStyle="#1c3148";

ctx.fillText(
historiaAtual.nome.toUpperCase(),
200,
55
);


/* DESENHAR */

let desenhando=false;

let ultimoPonto;


function posicao(evento){

const rect =
canvas.getBoundingClientRect();

return {

x:
(evento.clientX-rect.left)
*
canvas.width
/
rect.width,

y:
(evento.clientY-rect.top)
*
canvas.height
/
rect.height

};

}


canvas.addEventListener(
"pointerdown",
function(evento){

desenhando=true;

ultimoPonto=
posicao(evento);

canvas.setPointerCapture(
evento.pointerId
);

}
);


canvas.addEventListener(
"pointermove",
function(evento){

if(!desenhando)return;

const ponto =
posicao(evento);

ctx.strokeStyle=
corAtual;

ctx.lineWidth=20;

ctx.lineCap="round";

ctx.beginPath();

ctx.moveTo(
ultimoPonto.x,
ultimoPonto.y
);

ctx.lineTo(
ponto.x,
ponto.y
);

ctx.stroke();

ultimoPonto=ponto;

}
);


canvas.addEventListener(
"pointerup",
function(){

desenhando=false;

}
);


canvas.addEventListener(
"pointercancel",
function(){

desenhando=false;

}
);

}


/* =====================================================
PUZZLE COM ARRASTAR
===================================================== */

const puzzle =
document.getElementById("puzzle");


const posicoes=[

[0,0],

[33.333,0],

[66.666,0],

[0,50],

[33.333,50],

[66.666,50]

];


posicoes.forEach(
function(posicao,index){


const peca =
document.createElement("div");


peca.className="peca";


peca.style.left=
posicao[0]+"%";


peca.style.top=
posicao[1]+"%";


const coluna =
index%3;


const linha =
Math.floor(index/3);


peca.style.backgroundPosition=

(coluna*50)+"% "

+

(linha*100)+"%";


let arrastando=false;

let inicioX;

let inicioY;

let esquerdaInicial;

let topoInicial;


/* COMEÇAR */

peca.addEventListener(
"pointerdown",
function(evento){

arrastando=true;

inicioX=evento.clientX;

inicioY=evento.clientY;

esquerdaInicial=
parseFloat(peca.style.left);

topoInicial=
parseFloat(peca.style.top);

peca.setPointerCapture(
evento.pointerId
);

peca.style.zIndex=10;

}
);


/* ARRASTAR */

peca.addEventListener(
"pointermove",
function(evento){

if(!arrastando)return;

const rect=
puzzle.getBoundingClientRect();


const moverX=

(evento.clientX-inicioX)
/
rect.width
*
100;


const moverY=

(evento.clientY-inicioY)
/
rect.height
*
100;


peca.style.left=

(esquerdaInicial+moverX)
+
"%";


peca.style.top=

(topoInicial+moverY)
+
"%";

}
);


/* SOLTAR */

peca.addEventListener(
"pointerup",
function(){

arrastando=false;

peca.style.zIndex=1;

}
);


puzzle.appendChild(peca);

}

);

}

</script>

</body>
</html>
